<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* body{
        display: flex;
        flex-direction: column;
    } */
    .box{
        background-color: aqua;

        height: auto;
        min-height: 300px;
        width: 700px;
        display: flex;
        justify-content: space-around;
        align-items: flex-end;
        border-left: solid 2px pink;
        border-bottom: solid 2px pink;
        margin-left: 35%;
    }
    .box2{
        background-color: blue;

        width: 700px;
        display: flex;
        justify-content: space-around;
        margin-left: 35%;
    }
    .box > div{
        background-color: brown;
        width: 40px;
        height: 1cm;
        margin: 0 65px;
    }
    .box2 > div{
        background-color: purple;

        color: white;
        width: 40px;
        font-size: 20px;
        text-align: center;
    }
    img{
        width: 100%;
        height: 100%;
        margin-bottom: 0;
    }
</style>
<body>
    <div class="box">
    <div>
        <img id="1" src="耄耋.jpg" alt="">
    </div>
    <div>
        <img id="2" src="耄耋.jpg" alt="">
    </div>
    <div>
        <img id="3" src="耄耋.jpg" alt="">
    </div>
    <div>
        <img id="4" src="耄耋.jpg" alt="">
    </div>

    <br>

    </div>
    <div class="box2">
        <div>同学</div>
        <div>室友</div>
        <div>兄弟</div>
        <div>自己</div>
    </div>

    <script>
        document.getElementById('1').parentNode.style.height =
Math.min(+(prompt("请输入同学的长度(cm)：", 1)) || 1, 15) + 'cm';
document.getElementById('2').parentNode.style.height =
Math.min(+(prompt("请输入室友的长度(cm)：", 1)) || 1, 15) + 'cm';
document.getElementById('3').parentNode.style.height =
Math.min(+(prompt("请输入兄弟的长度(cm)：", 1)) || 1, 15) + 'cm';
document.getElementById('4').parentNode.style.height =
Math.min(+(prompt("请输入自己的长度(cm)：", 1)) || 1, 15) + 'cm';
    </script>
</body>
</html>
