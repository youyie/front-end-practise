<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单确认</title>
</head>
<style>
    h2{
        text-align: center;
    }

    table{
        height: 100px;
        margin: 0 auto;
        border-collapse: collapse;
    }

    tr{
        text-align: center;
    }

    th{
        padding: 5px 30px;
    }

    table,tr,th{
        border: 1px solid #000;
    }
</style>
<body>
    <h2>订单确认</h2>

    <table>
        <tr>
            <th>商品名称</th>
            <th>商品单价</th>
            <th>购买数量</th>
            <th>总价</th>
            <th>收货地址</th>
        </tr>
        <tr>
            <th>柔情猫娘</th>
            <th id="price">98元</th>
            <th id="quantity">10</th>
            <th id="totalPrice">980元</th>
            <th id="address">成都信息工程大学</th>
        </tr>
        <script>
            let price = +prompt('请输入购买数量');
            document.getElementById("quantity").innerHTML = price;
            document.getElementById("totalPrice").innerHTML = 98 * price +'元'
            document.getElementById("address").innerHTML = prompt('请输入地址');
            alert('小色鬼！');
        </script>
    </table>
</body>
</html>
